name: Deploy to GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Build prod (main)
        run: |
          git checkout main 2>/dev/null || git checkout -B main origin/main
          cargo build --release --target wasm32-unknown-unknown
          cp target/wasm32-unknown-unknown/release/retro_orbit_visualizer.wasm /tmp/prod.wasm

      - name: Build dev
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/dev; then
            git checkout -B dev origin/dev
            cargo build --release --features dev-overlay --target wasm32-unknown-unknown
            cp target/wasm32-unknown-unknown/release/retro_orbit_visualizer.wasm /tmp/dev.wasm
          fi

      - name: Assemble prod
        run: |
          mkdir -p dist
          git show main:index.html > dist/index.html
          git show main:web/mq_js_bundle.js > dist/mq_js_bundle.js
          cp /tmp/prod.wasm dist/retro_orbit_visualizer.wasm

      - name: Assemble dev
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/dev; then
            mkdir -p dist/dev
            git show dev:index.html > dist/dev/index.html
            git show dev:web/mq_js_bundle.js > dist/dev/mq_js_bundle.js
            cp /tmp/dev.wasm dist/dev/retro_orbit_visualizer.wasm
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

      - name: Wait for artifact propagation
        run: sleep 15

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
