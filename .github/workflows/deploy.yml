name: Deploy to GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Build prod (main)
        run: |
          git checkout main 2>/dev/null || git checkout -B main origin/main
          cargo build --release --target wasm32-unknown-unknown
          cp target/wasm32-unknown-unknown/release/retro_orbit_visualizer.wasm /tmp/prod.wasm

      - name: Build dev
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/dev; then
            git checkout -B dev origin/dev
            cargo build --release --features dev-overlay --target wasm32-unknown-unknown
            cp target/wasm32-unknown-unknown/release/retro_orbit_visualizer.wasm /tmp/dev.wasm
          fi

      - name: Assemble prod
        run: |
          mkdir -p dist
          git show main:index.html > dist/index.html
          git show main:web/mq_js_bundle.js > dist/mq_js_bundle.js
          cp /tmp/prod.wasm dist/retro_orbit_visualizer.wasm

      - name: Assemble dev
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/dev; then
            mkdir -p dist/dev
            git show dev:index.html > dist/dev/index.html
            git show dev:web/mq_js_bundle.js > dist/dev/mq_js_bundle.js
            cp /tmp/dev.wasm dist/dev/retro_orbit_visualizer.wasm
          fi

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist

      - name: Wait for artifact propagation
        run: sleep 15

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
